services:
  - type: web
    name: proyectolyep2026-server
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Se completan en el dashboard de Render (no se versionan).
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
